name: "🚀 Deploy"
description: "배포"
labels: ["deploy"]
body:
  - type: textarea
    attributes:
      label: 📄 배포 목적
      description: 이번 배포의 목적과 주요 변경 사항을 작성해 주세요.
      placeholder: 어떤 기능/수정 사항이 포함되는지 자세히 적어주세요!
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 배포 전 체크리스트
      description: 배포 전 확인해야 할 항목을 체크박스 형태로 작성해주세요.
      placeholder: |
        - [ ] 테스트 완료
        - [ ] 환경 변수 확인
        - [ ] 빌드 정상 동작 확인
    validations:
      required: true
  - type: textarea
    attributes:
      label: 📅 배포 일정
      description: 배포 예정 일시를 작성해 주세요.
      placeholder: "예: 2026-07-15 15:00"
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔄 롤백 계획
      description: 문제가 발생했을 경우 롤백 방법을 작성해 주세요.
      placeholder: 롤백 절차, 담당자 등을 적어주세요.
    validations:
      required: false
  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.
    validations:
      required: false

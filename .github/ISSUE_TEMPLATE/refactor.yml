name: "♻️ Refactor"
description: "리팩토링"
labels: ["refactor"]
body:
  - type: textarea
    attributes:
      label: 📄 설명
      description: 리팩토링이 필요한 이유와 대상에 대해 작성해 주세요.
      placeholder: 어떤 부분을, 왜 개선하고 싶은지 자세히 적어주세요!
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🎯 개선 방향
      description: 어떻게 개선할 계획인지 작성해 주세요.
      placeholder: 구조 변경, 네이밍 개선, 중복 제거 등 구체적인 방향을 적어주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
      placeholder: 최대한 세분화 해서 적어주세요!
    validations:
      required: true
  - type: textarea
    attributes:
      label: ⚠️ 영향 범위
      description: 이 리팩토링이 영향을 줄 수 있는 범위를 작성해 주세요.
      placeholder: 관련 모듈, 기능, 테스트 등을 적어주세요.
    validations:
      required: false
  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.
    validations:
      required: false

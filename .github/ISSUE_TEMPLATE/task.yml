name: "📋 Task"
description: "일반 작업 (문서화, 설정 변경, 조사 등)"
labels: ["task"]
body:
  - type: textarea
    attributes:
      label: 📄 작업 설명
      description: 어떤 작업인지 목적과 배경을 작성해 주세요.
      placeholder: 자세히 적을수록 좋습니다!
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 할 일을 체크박스 형태로 작성해주세요.
      placeholder: |
        - [ ] 작업 내용 1
        - [ ] 작업 내용 2
      render: markdown
    validations:
      required: true
  - type: textarea
    attributes:
      label: ⚠️ 영향 범위
      description: 이 작업이 영향을 줄 수 있는 범위를 작성해 주세요.
      placeholder: 관련 모듈, 기능, 팀원 등을 적어주세요.
    validations:
      required: false
  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 자료가 있다면 작성해 주세요.
    validations:
      required: false

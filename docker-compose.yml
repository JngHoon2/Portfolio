# ====================================================================
# 포트폴리오 정적 사이트 배포 - Caddy 단일 컨테이너
# HTTPS 처리 + 정적 파일 서빙을 Caddy 하나가 모두 담당한다.
# ====================================================================
services:
  caddy:
    image: caddy:2-alpine
    container_name: portfolio-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (인증서 발급 챌린지 및 HTTPS 리다이렉트)
      - "443:443"   # HTTPS
    volumes:
      # Caddy 설정 파일 (읽기 전용)
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      # Compose Multiplatform 프로덕션 빌드 산출물을 정적 루트로 마운트 (읽기 전용)
      - ./webApp/build/dist/wasmJs/productionExecutable:/srv/webapp:ro
      # ⚠️ 인증서/계정 정보 영속화 볼륨 - 절대 삭제하지 말 것!
      #    이 볼륨을 삭제하면 Let's Encrypt 인증서가 재발급되며,
      #    짧은 시간 내 반복 발급 시 Rate Limit 에 걸릴 수 있다.
      - caddy_data:/data
      # Caddy 런타임 설정 캐시 (자동 관리)
      - caddy_config:/config

volumes:
  # ⚠️ caddy_data: 인증서/ACME 계정 정보 저장. 삭제 금지!
  caddy_data:
  caddy_config:
